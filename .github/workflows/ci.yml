name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python syntax & translation table
        run: |
          python -m py_compile tools/*.py
          python - <<'EOF'
          import sys
          sys.path.insert(0, "tools")
          import translations
          print(f"translations.py OK: {len(translations.T)} entries")
          EOF
      - name: Lua syntax check (luac)
        run: |
          sudo apt-get update && sudo apt-get install -y lua5.3
          for f in tools/*.lua; do
            luac5.3 -p "$f" || { echo "Lua parse failed: $f"; exit 1; }
          done
          echo "all Lua scripts parse OK"
      - name: IPS patches well-formed
        run: python .github/scripts/check_ips.py
      - name: Round-trip patch_rom/make_ips on synthetic ROMs
        run: python .github/scripts/test_roundtrip.py
      - name: Internal links & screenshots
        run: python .github/scripts/check_links.py
